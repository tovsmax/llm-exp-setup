name: les

services:

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    restart: unless-stopped
    ports:
      # Exposes both the Web UI and the OpenAI API
      - "8080:8080"
    volumes:
      # Unsloth Desktop model dir
      - ${HOME}/AppImages/unsloth.appimage.home/.cache/huggingface:${HOME}/AppImages/unsloth.appimage.home/.cache/huggingface:ro
      - ./llama_models:/models:ro
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-dir"
      - "/models"
      - "--models-max"
      - "1"
      - "--sleep-idle-seconds"
      - "1800" # 60 min time-to-live
      - "-lv" # log verbosity level / level of verbosity
      - "4"
      - "-c"
      - "32768" # Context window size
      # --- Automatic VRAM Fitting Options ---
      - "--fit"
      - "on"
      - "-ngl"
      - "auto"
      # Reserve safety margin in MB (prevent CUDA OOM from compute/scratch buffers)
      - "--fit-target"
      - "1024"
      - "--metrics"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]



  glances:
    image: nicolargo/glances:ubuntu-latest-full
    restart: unless-stopped
    pid: host # Required so Glances can view host-level processes
    environment:
      # -C specifies the config file; -w enables the Web UI; --export enables Prometheus
      # Use -q (quiet) instead of -w (web
      - GLANCES_OPT=-C /glances/conf/glances.conf -q --export prometheus
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro # Essential for Glances to read AMD sysfs telemetry
      - ./glances.conf:/glances/conf/glances.conf:ro
    ports:
      # - "61208:61208" # Glances Web UI
      - "9091:9091"   # Prometheus Exporter endpoint
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]



  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
       - '--config.file=/etc/prometheus/prometheus.yml'
       - '--storage.tsdb.path=/prometheus'
       - '--storage.tsdb.retention.size=10GB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus:z
    ports:
      - "9090:9090"
    depends_on:
      - glances



  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped
    environment:
      # Must match GF_RENDERING_RENDERER_TOKEN above
      - AUTH_TOKEN=my_super_secret_token_12345
      - ENABLE_METRICS=false



  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    # Bind to 127.0.0.1 so only your PC can access it (security best practice for no-auth)
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Enable anonymous access
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # Grant full Admin permissions to the anonymous user
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      # Hide the login form completely
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      # Grafana image renderer
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=my_super_secret_token_12345
    volumes:
      - ./grafana_data:/var/lib/grafana:z
    depends_on:
      - prometheus
      - renderer



  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng.yaml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_PORT=8282
      - SEARXNG_BASE_URL=http://searxng:8282/
    # Optional: expose 8888 if you want to test SearXNG directly in your host browser
    ports:
      - "127.0.0.1:8282:8282"



  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:9120:9120" # Hermes Desktop webui (bound locally for security)
      - "127.0.0.1:9119:9119" # Web Dashboard
      - "8642:8642"           # Hermes API & Gateway endpoint
    volumes:
      - ./hermes.yaml:/opt/data/config.yaml:z
      # Stores SQLite database, sessions, skills, and memory
      - ./hermes_data:/opt/data
      # Mount your host workspace if you want Hermes Desktop to browse/edit local code
      - ${HOME}/Projects:/workspace
    environment:
      # Map container user to host UID/GID so data remains editable
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      # Tell Hermes where to query your local llama-server
      - OPENAI_BASE_URL=http://llama-server:8080/v1
      - OPENAI_API_KEY=not-needed
      # Prevent timeouts while local model is thinking
      - HERMES_STREAM_STALE_TIMEOUT=300
      - HERMES_DASHBOARD=1
      # Hermes WebUI
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=poh
      - SEARXNG_URL=http://searxng:8282
    depends_on:
      - llama-server
      - searxng
